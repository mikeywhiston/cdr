  <text x="210" y="96" text-anchor="middle" font-size="6" font-style="italic" fill="#6E7478">no other input</text>

  <text x="268" y="82" font-size="7.5" fill="#6E7478">sees the claim,</text>
  <text x="268" y="94" font-size="7.5" font-weight="bold" fill="#6E7478">reports nothing</text>

  <path d="M 34 110 L 34 130 L 154 130" fill="none" stroke="#1F4E79" stroke-width="1" marker-end="url(#ab)"/>

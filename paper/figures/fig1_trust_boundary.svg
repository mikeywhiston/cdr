<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 450" width="1240" height="450" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A93226"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E79"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E7478"/>
    </marker>
  </defs>

  <!-- headline -->
  <text x="400" y="34" text-anchor="middle" font-size="11" font-style="italic" fill="#6E7478">write-authority boundary</text>
  <text x="1224" y="34" text-anchor="end" font-size="11" font-style="italic" fill="#6E7478">one action, two records</text>

  <!-- boundary -->
  <line x1="400" y1="46" x2="400" y2="404" stroke="#6E7478" stroke-width="1.4" stroke-dasharray="7 5"/>

  <!-- agent container -->
  <rect x="20" y="66" width="340" height="250" rx="4" fill="#FDF1EF" stroke="#A93226" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="190" y="58" text-anchor="middle" font-size="11" font-style="italic" fill="#A93226">agent container, root inside</text>

  <rect x="40" y="86" width="300" height="50" rx="3" fill="#FFFFFF" stroke="#A93226" stroke-width="1"/>
  <text x="190" y="116" text-anchor="middle" font-size="13" fill="#1A1A1A">model turns, tool calls</text>

  <rect x="40" y="176" width="110" height="76" rx="3" fill="#FFFFFF" stroke="#A93226" stroke-width="1"/>
  <text x="95" y="207" text-anchor="middle" font-size="13" fill="#1A1A1A">shell</text>
  <text x="95" y="226" text-anchor="middle" font-size="10" font-family="DejaVu Sans Mono, monospace" fill="#444444">write, read, exec</text>

  <rect x="190" y="176" width="150" height="76" rx="3" fill="#FFFFFF" stroke="#A93226" stroke-width="1"/>
  <text x="265" y="203" text-anchor="middle" font-size="13" fill="#1A1A1A">transcript</text>
  <text x="265" y="220" text-anchor="middle" font-size="11" fill="#A93226">written by the agent</text>
  <text x="265" y="238" text-anchor="middle" font-size="10" font-style="italic" fill="#6E7478">a claim</text>

  <line x1="190" y1="147" x2="190" y2="172" stroke="#6E7478" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="198" y="164" font-size="10" fill="#6E7478">acts</text>

  <line x1="154" y1="214" x2="186" y2="214" stroke="#6E7478" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="170" y="232" text-anchor="middle" font-size="9" fill="#6E7478">declares</text>

  <text x="190" y="344" text-anchor="middle" font-size="10" font-style="italic" fill="#A93226">everything in this box can be rewritten by the agent</text>

  <!-- in-band path -->
  <line x1="344" y1="214" x2="446" y2="214" stroke="#A93226" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="396" y="204" text-anchor="middle" font-size="10" fill="#A93226">reads</text>

  <rect x="450" y="176" width="200" height="76" rx="3" fill="#F4F5F6" stroke="#6E7478" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="550" y="207" text-anchor="middle" font-size="13" fill="#1A1A1A">log-only monitor</text>
  <text x="550" y="226" text-anchor="middle" font-size="10" font-style="italic" fill="#6E7478">has no other input</text>

  <text x="668" y="206" font-size="12" fill="#6E7478">sees the claim,</text>
  <text x="668" y="226" font-size="12" font-weight="bold" fill="#6E7478">reports nothing</text>

  <!-- kernel path -->
  <path d="M 110 252 L 110 302 L 442 302" fill="none" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="276" y="294" text-anchor="middle" font-size="10" fill="#1F4E79">performs</text>

  <rect x="450" y="270" width="130" height="64" rx="3" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.1"/>
  <text x="515" y="297" text-anchor="middle" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#1A1A1A">sys_enter</text>
  <text x="515" y="314" text-anchor="middle" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#1A1A1A">sys_exit</text>

  <rect x="598" y="270" width="130" height="64" rx="3" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.1"/>
  <text x="663" y="297" text-anchor="middle" font-size="12" fill="#1A1A1A">ring buffer</text>
  <text x="663" y="314" text-anchor="middle" font-size="10" fill="#6E7478">512 KiB</text>

  <rect x="746" y="270" width="170" height="64" rx="3" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.1"/>
  <text x="831" y="293" text-anchor="middle" font-size="12" fill="#1A1A1A">resolve (dev, ino)</text>
  <text x="831" y="311" text-anchor="middle" font-size="12" fill="#1A1A1A">attribute cgroup inode</text>

  <rect x="934" y="270" width="140" height="64" rx="3" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.1"/>
  <text x="1004" y="293" text-anchor="middle" font-size="12" fill="#1A1A1A">cross-agent</text>
  <text x="1004" y="311" text-anchor="middle" font-size="12" fill="#1A1A1A">edges</text>

  <rect x="1092" y="270" width="140" height="64" rx="3" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.1"/>
  <text x="1162" y="297" text-anchor="middle" font-size="12" fill="#1A1A1A">policy</text>
  <text x="1162" y="314" text-anchor="middle" font-size="10" fill="#6E7478">sanctioned?</text>

  <line x1="580" y1="302" x2="594" y2="302" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="728" y1="302" x2="742" y2="302" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="916" y1="302" x2="930" y2="302" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="1074" y1="302" x2="1088" y2="302" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#ab)"/>

  <text x="1162" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F4E79">edge alpha to beta</text>
  <text x="1162" y="383" text-anchor="middle" font-size="10" font-family="DejaVu Sans Mono, monospace" fill="#444444">/shared/cache/alpha.out</text>
  <text x="1162" y="400" text-anchor="middle" font-size="10" fill="#A93226">unsanctioned</text>

  <!-- legend -->
  <line x1="24" y1="430" x2="58" y2="430" stroke="#A93226" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="66" y="434" font-size="10" fill="#6E7478">agent-authorable record</text>
  <line x1="228" y1="430" x2="262" y2="430" stroke="#1F4E79" stroke-width="1.8"/>
  <text x="270" y="434" font-size="10" fill="#6E7478">kernel-attested record</text>
</svg>

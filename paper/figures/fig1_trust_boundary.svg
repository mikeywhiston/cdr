<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 190" width="468" height="190" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A93226"/></marker>

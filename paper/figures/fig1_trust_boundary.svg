  <text x="408" y="129" text-anchor="middle" font-size="5.8" font-family="DejaVu Sans Mono, monospace" fill="#444444">/shared/cache/alpha.out</text>
  <text x="408" y="140" text-anchor="middle" font-size="5.8" font-family="DejaVu Sans Mono, monospace" fill="#1F4E79">dev 30, ino 2730704</text>
  <text x="408" y="152" text-anchor="middle" font-size="6.2" fill="#A93226">unsanctioned</text>


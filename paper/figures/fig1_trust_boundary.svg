  <text x="107" y="103" text-anchor="middle" font-size="6" font-style="italic" fill="#6E7478">a claim</text>

  <line x1="34" y1="52" x2="34" y2="64" stroke="#6E7478" stroke-width="0.6" marker-end="url(#ag)"/>
  <text x="37" y="60" font-size="5.8" fill="#6E7478">acts</text>
  <line x1="60" y1="88" x2="77" y2="88" stroke="#6E7478" stroke-width="0.6" marker-end="url(#ag)"/>

  <text x="72" y="163" text-anchor="middle" font-size="6.2" font-style="italic" fill="#A93226">everything here is agent-written</text>

  <line x1="140" y1="88" x2="154" y2="88" stroke="#A93226" stroke-width="0.9" stroke-dasharray="3 2" marker-end="url(#ar)"/>


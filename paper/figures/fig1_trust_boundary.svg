    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6E7478"/></marker>
  </defs>

  <text x="148" y="9" text-anchor="middle" font-size="6.5" font-style="italic" fill="#6E7478">write-authority boundary</text>

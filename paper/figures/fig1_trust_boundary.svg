  <text x="34" y="96" text-anchor="middle" font-size="5.8" font-style="italic" fill="#6E7478">runs cmds</text>

  <rect x="80" y="66" width="54" height="44" rx="1.5" fill="#FFFFFF" stroke="#A93226" stroke-width="0.6"/>

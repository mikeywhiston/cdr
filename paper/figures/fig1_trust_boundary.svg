  <text x="26" y="182" font-size="6.2" fill="#6E7478">agent-authorable</text>
  <line x1="86" y1="180" x2="102" y2="180" stroke="#1F4E79" stroke-width="1"/>
  <text x="106" y="182" font-size="6.2" fill="#6E7478">kernel-attested</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 440" width="1240" height="440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A93226"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E79"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E7478"/>
    </marker>
  </defs>

  <text x="400" y="34" text-anchor="middle" font-size="11" font-style="italic" fill="#6E7478">write-authority boundary</text>
  <line x1="400" y1="46" x2="400" y2="398" stroke="#6E7478" stroke-width="1.4" stroke-dasharray="7 5"/>

  <!-- agent container -->
  <rect x="20" y="66" width="340" height="272" rx="4" fill="#FDF1EF" stroke="#A93226" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="190" y="58" text-anchor="middle" font-size="11" font-style="italic" fill="#A93226">agent container, root inside</text>

  <rect x="40" y="86" width="300" height="50" rx="3" fill="#FFFFFF" stroke="#A93226" stroke-width="1"/>
  <text x="190" y="116" text-anchor="middle" font-size="13" fill="#1A1A1A">model turns, tool calls</text>

  <rect x="40" y="176" width="110" height="76" rx="3" fill="#FFFFFF" stroke="#A93226" stroke-width="1"/>
  <text x="95" y="207" text-anchor="middle" font-size="13" fill="#1A1A1A">shell</text>
  <text x="95" y="226" text-anchor="middle" font-size="10" font-family="DejaVu Sans Mono, monospace" fill="#444444">write, read, exec</text>

  <rect x="190" y="176" width="150" height="76" rx="3" fill="#FFFFFF" stroke="#A93226" stroke-width="1"/>
  <text x="265" y="203" text-anchor="middle" font-size="13" fill="#1A1A1A">transcript</text>
  <text x="265" y="220" text-anchor="middle" font-size="11" fill="#A93226">written by the agent</text>
  <text x="265" y="238" text-anchor="middle" font-size="10" font-style="italic" fill="#6E7478">a claim</text>

  <line x1="190" y1="147" x2="190" y2="172" stroke="#6E7478" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="198" y="164" font-size="10" fill="#6E7478">acts</text>
  <line x1="154" y1="214" x2="186" y2="214" stroke="#6E7478" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="170" y="233" text-anchor="middle" font-size="10" fill="#6E7478">declares</text>

  <text x="190" y="360" text-anchor="middle" font-size="10" font-style="italic" fill="#A93226">everything in this box can be rewritten by the agent</text>

  <!-- in-band path -->
  <line x1="344" y1="214" x2="446" y2="214" stroke="#A93226" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="396" y="204" text-anchor="middle" font-size="10" fill="#A93226">reads</text>

  <rect x="450" y="176" width="200" height="76" rx="3" fill="#F4F5F6" stroke="#6E7478" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="550" y="207" text-anchor="middle" font-size="13" fill="#1A1A1A">log-only monitor</text>
  <text x="550" y="226" text-anchor="middle" font-size="10" font-style="italic" fill="#6E7478">has no other input</text>

  <text x="668" y="206" font-size="12" fill="#6E7478">sees the claim,</text>
  <text x="668" y="226" font-size="12" font-weight="bold" fill="#6E7478">reports nothing</text>

  <!-- kernel path -->
  <path d="M 110 252 L 110 314 L 442 314" fill="none" stroke="#1F4E79" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="272" y="306" text-anchor="middle" font-size="10" fill="#1F4E79">performs</text>

  <rect x="450" y="282" width="170" height="64" rx="3" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.1"/>
  <text x="535" y="309" text-anchor="middle" font-size="12" fill="#1A1A1A">file syscall</text>
  <text x="535" y="327" text-anchor="middle" font-size="10" fill="#6E7478">witnessed in kernel</text>

  <rect x="655" y="282" width="230" height="64" rx="3" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.1"/>
  <text x="770" y="305" text-anchor="middle" font-size="12" fill="#1A1A1A">who acted, on what</text>
  <text x="770" y="324" text-anchor="middle" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1F4E79">cgroup inode, (dev, ino)</text>

  <line x1="620" y1="314" x2="651" y2="314" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="885" y1="314" x2="916" y2="314" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- verdict card -->
  <rect x="920" y="252" width="300" height="112" rx="4" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="1070" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79">edge alpha to beta</text>
  <text x="1070" y="300" text-anchor="middle" font-size="10" font-family="DejaVu Sans Mono, monospace" fill="#444444">/shared/cache/alpha.out</text>
  <text x="1070" y="318" text-anchor="middle" font-size="10" font-family="DejaVu Sans Mono, monospace" fill="#1F4E79">dev 30, ino 2730704</text>
  <text x="1070" y="342" text-anchor="middle" font-size="11" fill="#A93226">unsanctioned</text>

  <!-- legend -->
  <line x1="24" y1="414" x2="58" y2="414" stroke="#A93226" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="66" y="418" font-size="10" fill="#6E7478">agent-authorable record</text>
  <line x1="228" y1="414" x2="262" y2="414" stroke="#1F4E79" stroke-width="1.8"/>
  <text x="270" y="418" font-size="10" fill="#6E7478">kernel-attested record</text>
</svg>
